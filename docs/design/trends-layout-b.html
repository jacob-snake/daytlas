<!-- Trends layout variant B: Pravý sticky sidebar, timeline hore na šírku -->
<title>Trends layout B — Pravý sticky sidebar, timeline hore na šírku</title>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f4f3ee;color:#1c1b16;margin:0;padding:24px}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:16px;grid-template-columns:1fr 240px}
.bar{background:#fffdf9;border:1px solid #e4e2da;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 2px rgba(28,25,15,.04)}
.sticky{position:sticky;top:12px;z-index:5}
.chip{border:1px solid #d7d5cc;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600;background:#fff}
.chip.on{background:#1c1b16;color:#fff}
.seg{display:flex;background:#ecebe3;border-radius:10px;padding:3px}
.seg span{padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600}
.seg .on{background:#fff}
.tl{background:#fffdf9;border:1px solid #e4e2da;border-radius:16px;padding:16px;grid-column:1/-1}
.tl .area{height:120px;border-radius:10px;background:linear-gradient(180deg,rgba(69,111,16,.4),rgba(69,111,16,.05));position:relative;overflow:hidden}
.tl .sel{position:absolute;left:22%;right:30%;top:0;bottom:0;background:rgba(69,111,16,.18);border-left:6px solid #1c1b16;border-right:6px solid #1c1b16;border-radius:4px}
.card{background:#fffdf9;border:1px solid #e4e2da;border-radius:16px;padding:16px;min-height:120px}
h1{font-size:20px;margin:.2em 0}
h2{font-size:16px;margin:.2em 0}
small{color:#7d7a6e}
aside{display:grid;gap:10px;align-content:start}
.nav a{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;text-decoration:none;color:#1c1b16;padding:6px 10px;border-radius:10px}
.nav a.on{background:#ecebe3}
.dot{width:10px;height:10px;border-radius:50%}
</style>
<div class="wrap">
<div class="tl"><h2>Timeline · <small>Readiness score</small></h2><div class="area"><div class="sel"></div></div></div><div style="display:grid;gap:16px"><div class="card"><h2>Sleep Score</h2><small>chart…</small></div><div class="card"><h2>Total Sleep</h2><small>chart…</small></div></div><aside class="bar sticky" style="flex-direction:column;align-items:stretch"><span class="nav"><a class="on" href="#"><span class="dot" style="background:#2e6be6"></span>Sleep</a></span>
<span class="nav"><a href="#"><span class="dot" style="background:#456f10"></span>Readiness</a></span>
<span class="nav"><a href="#"><span class="dot" style="background:#e26e0a"></span>Activity</a></span><hr style="border:none;border-top:1px solid #e4e2da;width:100%"><span class="chip on">All data</span><span class="chip">1 Y</span><span class="chip">90 D</span><span class="chip">30 D</span>
<span class="chip">📅 1 May 2021 – 16 Jul 2026</span>
<div class="seg"><span>Day</span><span class="on">Week</span><span>Month</span><span>Quarter</span><span>Year</span></div></aside>
</div>
